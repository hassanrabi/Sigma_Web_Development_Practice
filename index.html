<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Execise 5</title>
    <style>
        body {
            margin: 0px;
            padding: 0px;
        }
        header{
            position: sticky;
            top: 0;
            z-index: 100;
        }

        nav {
            height: 8vh;
            padding: 0px;
            margin: 0px;
            background-color: pink;

        }

        .container {
            background-color: green;
            display: flex;
            text-align: center;
            margin: 15px 20px;
            padding: 20px;
            border-radius: 30px;
            gap: 15px;

        }

        .box1 {
            height: 60vh;
            background-color: brown;
            width: 45vw;
            border: 4px solid white;
            border-radius: 20px;

        }

        .box2 {
            height: 60vh;
            background-color: blue;
            width: 45vw;
            border: 4px solid white;
            border-radius: 20px;
        }
        
        
        .welcome-box{
            font-size: 20px;
            font-weight: bold;
            font-family: Arial, Helvetica, sans-serif;
            height: 10vh;
            width: 70vw;
            background-color: grey;
            margin: 20px auto;
            border: 2px solid black;
            border-radius: 20px;
           display: flex;
           justify-content: center;
           align-items: center;
        }
        .circle{
            height: 30px;
            width: 30px;
            background-color: black;
            border-radius: 50%;
            bottom: 10px;
            right: 10px;
            position: fixed;
        }
        footer{
            height: 10vh;
            background-color: rgb(245, 140, 21);
            margin-top: 30px;
        }
    </style>
</head>

<body>
    <header>
        <nav>

        </nav>
    </header>

    <main>
        <div class="container">
            <div class="box1"></div>
            <div class="box2"></div>
        </div>
        
            <div class="welcome-box">
        Welcome to Sigma Web Development Course
        </div>
    <div class="circle"></div>
    </main>

    <footer>

    </footer>
</body>


</html>
